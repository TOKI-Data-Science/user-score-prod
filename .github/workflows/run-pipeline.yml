name: Run pipeline

on:
  schedule:
    # 11:00 Asia/Ulaanbaatar (UTC+8) on the 3rd of every month = 03:00 UTC
    - cron: "0 3 3 * *"
    # 17:00 Asia/Ulaanbaatar on the 3rd = 09:00 UTC: continues the run above if it stopped at
    # DEADLINE_HOURS (partial) or failed; does nothing if that run already finished
    - cron: "0 9 3 * *"
  workflow_dispatch:
    inputs:
      resume:
        description: "Only continue an unfinished run of the month (do nothing if there is none)"
        type: boolean
        default: false
      run_month:
        description: "yyyymm of the run to start/continue (default: current month)"
        type: string
        default: ""
      force_rerun:
        description: "Ignore the unfinished run and start a new one"
        type: boolean
        default: false

# never run two pipelines at once; a queued resume waits for the running one
concurrency:
  group: run-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: [self-hosted, prod, container]
    environment: production
    timeout-minutes: 420
    steps:
      - name: Run user-score-prod image
        env:
          ORACLE_USERNAME: ${{ secrets.ORACLE_USERNAME }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_HOSTNAME: ${{ secrets.ORACLE_HOSTNAME }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_SERVICE: ${{ secrets.ORACLE_SERVICE }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          RESUME_ONLY: ${{ github.event.schedule == '0 9 3 * *' || inputs.resume || false }}
          FORCE_RERUN: ${{ inputs.force_rerun || false }}
          RUN_MONTH: ${{ inputs.run_month }}
        run: |
          docker run --rm \
            -e ORACLE_USERNAME \
            -e ORACLE_PASSWORD \
            -e ORACLE_HOSTNAME \
            -e ORACLE_PORT \
            -e ORACLE_SERVICE \
            -e LOG_LEVEL \
            -e RESUME_ONLY \
            -e FORCE_RERUN \
            -e RUN_MONTH \
            user-score-prod:latest
